version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: pmo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pmo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: pmo
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal

  backend:
    build: ./backend
    container_name: pmo_backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      - postgres
    networks:
      - internal

  nginx:
    image: nginx:stable-alpine
    container_name: pmo_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/pmo-bootstrap.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      - backend
    networks:
      - internal

  certbot:
    image: certbot/certbot
    container_name: pmo_certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

networks:
  internal:

volumes:
  pgdata:
  certbot_www:
  certbot_certs:
