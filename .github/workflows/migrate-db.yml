name: Migrate database to internal server

on:
  workflow_dispatch: {}

jobs:
  dump-old:
    runs-on: ubuntu-latest
    steps:
      - name: Dump database from the old server
        run: |
          set -e
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_deploy \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            'docker exec pmo_postgres pg_dump -U pmo -d pmo --no-owner --no-privileges' \
            > pmo_dump.sql
          test -s pmo_dump.sql
          wc -l pmo_dump.sql

      - name: Upload dump as artifact
        uses: actions/upload-artifact@v4
        with:
          name: pmo-db-dump
          path: pmo_dump.sql
          retention-days: 3

  restore-new:
    needs: dump-old
    runs-on: self-hosted
    steps:
      - name: Download dump artifact
        uses: actions/download-artifact@v4
        with:
          name: pmo-db-dump

      - name: Stop backend during restore
        run: docker compose -f /opt/pmo/deploy/docker-compose.yml stop backend

      - name: Reset schema and restore dump
        run: |
          set -e
          docker exec pmo_postgres psql -U pmo -d pmo -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public;"
          cat pmo_dump.sql | docker exec -i pmo_postgres psql -U pmo -d pmo
          echo "Restore complete $(date)"

      - name: Start backend
        run: docker compose -f /opt/pmo/deploy/docker-compose.yml up -d backend
