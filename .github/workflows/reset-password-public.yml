name: Reset a user's password (pmo.gigaenterprise.ai)

on:
  push:
    branches:
      - claude/deploy-project-domain-uji310
    paths:
      - ".github/workflows/reset-password-public.yml"
  workflow_dispatch: {}

jobs:
  reset:
    runs-on: [self-hosted, pmo-public]
    env:
      TARGET_EMAIL: slaide
    steps:
      - name: Generate a new password and hash it the same way the backend does
        run: |
          set -e
          PASS=$(openssl rand -base64 12)
          HASH=$(docker exec pmo_backend node -e "
            const bcrypt = require('bcryptjs');
            bcrypt.hash(process.argv[1], 10).then(h => console.log(h));
          " "$PASS")

          docker exec pmo_postgres psql -U pmo -d pmo -c \
            "UPDATE users SET password_hash='${HASH}', status='active' WHERE email='${TARGET_EMAIL}';"

          umask 077
          printf 'email=%s\npassword=%s\n' "$TARGET_EMAIL" "$PASS" > /opt/pmo/reset_password_credentials.txt
          echo "Password reset for ${TARGET_EMAIL} — credentials written to /opt/pmo/reset_password_credentials.txt on the server (not printed here)."
