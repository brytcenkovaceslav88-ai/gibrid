name: Deploy to pmo.gigaenterprise.ai (self-hosted runner)

on:
  push:
    branches:
      - claude/deploy-project-domain-uji310
    paths:
      - "index.html"
      - "deploy/**"
      - ".github/workflows/deploy-pmo-public.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: [self-hosted, pmo-public]
    env:
      DOMAIN: pmo.gigaenterprise.ai
    steps:
      - uses: actions/checkout@v4

      - name: Sync files into /opt/pmo/deploy
        run: |
          set -e
          mkdir -p /opt/pmo/deploy/frontend
          cp index.html /opt/pmo/deploy/frontend/index.html
          mkdir -p /opt/pmo/deploy/backend /opt/pmo/deploy/nginx
          cp -rf deploy/backend/. /opt/pmo/deploy/backend/
          cp -rf deploy/nginx/. /opt/pmo/deploy/nginx/
          cp deploy/docker-compose.yml /opt/pmo/deploy/docker-compose.yml

      - name: Check .env exists
        run: |
          if [ ! -f /opt/pmo/deploy/.env ]; then
            echo "::error::/opt/pmo/deploy/.env is missing — bootstrap the server once first (see deploy/README.md), then re-run this workflow."
            exit 1
          fi

      - name: Start core services (bootstrap nginx config, plain HTTP)
        working-directory: /opt/pmo/deploy
        run: |
          set -e
          docker compose up -d --build backend
          docker compose up -d postgres
          docker compose up -d nginx
          echo "Core services deployed $(date)"

      # A real certificate was purchased for *.gigaenterprise.ai, so no ACME
      # HTTP-01 challenge (and therefore no inbound port 80) is needed. The
      # cert/key never touch the repo or the Actions log — they come in as
      # encrypted repository secrets and are written straight to disk here.
      - name: Write TLS certificate from secrets
        working-directory: /opt/pmo/deploy
        run: |
          set -e
          mkdir -p nginx/certs
          umask 077
          cat > nginx/certs/server.crt << 'CERTEOF'
          ${{ secrets.PMO_TLS_CERT }}
          CERTEOF
          cat > nginx/certs/server.key << 'KEYEOF'
          ${{ secrets.PMO_TLS_KEY }}
          KEYEOF
          echo "Certificate and key written to nginx/certs/."

      - name: Write HTTPS nginx config and reload
        working-directory: /opt/pmo/deploy
        run: |
          set -e
          cat > nginx/pmo-bootstrap.conf << EOF
          server {
              listen 80;
              server_name ${DOMAIN};
              location / {
                  return 301 https://\$host\$request_uri;
              }
          }

          server {
              listen 443 ssl;
              server_name ${DOMAIN};

              ssl_certificate     /etc/nginx/certs/server.crt;
              ssl_certificate_key /etc/nginx/certs/server.key;

              location /api/ {
                  proxy_pass http://backend:3000;
                  proxy_set_header Host \$host;
                  proxy_set_header X-Real-IP \$remote_addr;
                  proxy_set_header X-Forwarded-Proto \$scheme;
              }

              root /usr/share/nginx/html;
              index index.html;
              location / {
                  try_files \$uri \$uri/ /index.html;
              }
          }
          EOF
          docker compose restart nginx
          echo "nginx reloaded with HTTPS config for ${DOMAIN}."

      - name: Final check
        run: |
          sleep 2
          curl -fsSk -o /dev/null -w "https://${DOMAIN}/ (local) -> %{http_code}\n" "https://localhost/" -H "Host: ${DOMAIN}" || true
