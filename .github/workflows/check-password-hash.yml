name: Diagnose migrated password hash

on:
  push:
    branches:
      - claude/deploy-project-domain-uji310
    paths:
      - ".github/workflows/check-password-hash.yml"
  workflow_dispatch: {}

jobs:
  check:
    runs-on: [self-hosted, pmo-internal]
    steps:
      - name: Show hash format for a real migrated user
        run: |
          set -e
          umask 077
          {
            echo "Runner host: $(hostname)"
            docker exec pmo_postgres psql -U pmo -d pmo -c \
              "SELECT email, length(password_hash) AS len, left(password_hash, 7) AS prefix, password_hash FROM users WHERE email='slaide';"
          } > /opt/pmo/password_hash_diagnosis.txt
          echo "Written to /opt/pmo/password_hash_diagnosis.txt on the server (not printed here)."
