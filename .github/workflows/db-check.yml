name: Check database contents

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
      - claude/deploy-project-domain-uji310
    paths:
      - ".github/workflows/db-check.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Query kv_store on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/pmo/deploy
            echo "--- projects-actiontasks: num/project/product/tbResponsible for first rows ---"
            docker compose exec -T postgres psql -U pmo -d pmo -c "
              SELECT elem->>'num' AS num, elem->>'project' AS project, elem->>'product' AS product, elem->>'tbResponsible' AS tbResponsible
              FROM kv_store, jsonb_array_elements(value) AS elem
              WHERE key='projects-actiontasks'
              ORDER BY (elem->>'num')::int
              LIMIT 5;
            "
