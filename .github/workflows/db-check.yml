name: Check database contents

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
      - claude/deploy-project-domain-uji310
    paths:
      - ".github/workflows/db-check.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Reset password for slaide@inbox.ru
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/pmo/deploy
            docker compose exec -T postgres psql -U pmo -d pmo -c "UPDATE users SET password_hash = '\$2a\$10\$oPPczeH1ytjkIL0MVIiV1ex/RIUNbxNFee7zOlesa20cJvDqWlgaG' WHERE email = 'slaide@inbox.ru';"
            docker compose exec -T postgres psql -U pmo -d pmo -c "SELECT id, email, status, is_admin FROM users WHERE email = 'slaide@inbox.ru';"
