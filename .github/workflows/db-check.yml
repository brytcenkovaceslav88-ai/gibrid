name: Check database contents

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
      - claude/deploy-project-domain-uji310
    paths:
      - ".github/workflows/db-check.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Replace admin account
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/pmo/deploy
            docker compose exec -T postgres psql -U pmo -d pmo -c "DELETE FROM users WHERE email = 'slaide@inbox.ru';"
            docker compose exec -T postgres psql -U pmo -d pmo -c "INSERT INTO users (email, password_hash, status, is_admin) VALUES ('slaide', '\$2a\$10\$j176ThVw5E4MAiFch2/izecvyUD649Al5tuMC702klNtYHslK70tu', 'active', true);"
            docker compose exec -T postgres psql -U pmo -d pmo -c "SELECT id, email, status, is_admin FROM users;"
