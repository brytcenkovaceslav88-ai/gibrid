name: Check database contents

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
      - claude/deploy-project-domain-uji310
    paths:
      - ".github/workflows/db-check.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Query server state
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/pmo/deploy
            echo "--- backend container status ---"
            docker compose ps backend
            echo "--- backend logs (last 30 lines) ---"
            docker compose logs --tail=30 backend
            echo "--- users table ---"
            docker compose exec -T postgres psql -U pmo -d pmo -c "SELECT id, email, status, is_admin FROM users;" 2>&1
            echo "--- API smoke test: /api/auth/me without cookie ---"
            curl -s http://localhost/api/auth/me
            echo ""
