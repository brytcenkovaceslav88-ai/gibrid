name: Migrate database to pmo.gigaenterprise.ai

on:
  push:
    branches:
      - claude/deploy-project-domain-uji310
    paths:
      - ".github/workflows/migrate-db-to-public.yml"
  workflow_dispatch: {}

jobs:
  dump-internal:
    runs-on: [self-hosted, pmo-internal]
    steps:
      - name: Dump database on the internal server (10.2.0.76)
        run: |
          set -e
          docker exec pmo_postgres pg_dump -U pmo -d pmo --no-owner --no-privileges > pmo_dump.sql
          test -s pmo_dump.sql
          wc -l pmo_dump.sql

      - name: Upload dump as artifact
        uses: actions/upload-artifact@v4
        with:
          name: pmo-db-dump-public
          path: pmo_dump.sql
          retention-days: 3

  restore-public:
    needs: dump-internal
    runs-on: [self-hosted, pmo-public]
    steps:
      - name: Download dump artifact
        uses: actions/download-artifact@v4
        with:
          name: pmo-db-dump-public

      - name: Stop backend during restore
        run: docker compose -f /opt/pmo/deploy/docker-compose.yml stop backend

      - name: Reset schema and restore dump
        run: |
          set -e
          docker exec pmo_postgres psql -U pmo -d pmo -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public;"
          cat pmo_dump.sql | docker exec -i pmo_postgres psql -U pmo -d pmo
          echo "Restore complete $(date)"

      - name: Start backend
        run: docker compose -f /opt/pmo/deploy/docker-compose.yml up -d backend
